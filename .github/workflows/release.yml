name: release
# Runs only on a version tag. The production environment requires the
# maintainer's approval and is the only place the signing secrets exist.
# There is no pull_request trigger, so secrets never reach a fork.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Release only what main already holds: a tag on a branch commit (or on
      # anything validate never ran on) stops here.
      - name: Tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Tag a commit of main whose validate run is green." >&2
            exit 1
          fi
      - name: CHANGELOG has a dated entry for the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          pattern="^## \[${version//./\\.}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}\$"
          if ! grep -Eq "$pattern" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version] - YYYY-MM-DD' heading. Date the entry on main, then tag again." >&2
            exit 1
          fi
      # No cache: a release never restores state a previous run wrote.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Unit tests only (no TF_ACC); the acceptance suite ran in validate.
      - run: go test ./...
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # The version this pipeline was dry-run with.
          version: v2.20.0
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
